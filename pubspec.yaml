name: liquidify
description: "Seamless Liquid Glass extension for standard Flutter widgets. Transform standard Material & Cupertino widgets into Apple-style Liquid Glass with .liquidGlass()."
version: 0.1.1
homepage: https://github.com/abdelhaliem/liquidify
repository: https://github.com/abdelhaliem/liquidify
issue_tracker: https://github.com/abdelhaliem/liquidify/issues
topics:
  - ui
  - glassmorphism
  - liquid-glass
  - ios
  - widgets

environment:
  sdk: ^3.12.1
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiquidifyPlugin
      macos:
        pluginClass: LiquidifyPlugin

